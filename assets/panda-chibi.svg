<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cute chibi panda">
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefb"/><stop offset=".62" stop-color="#f5f0e9"/><stop offset="1" stop-color="#e7ded4"/></linearGradient>
 <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a343d"/><stop offset="1" stop-color="#171b24"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffc6cc"/><stop offset="1" stop-color="#f18d9e"/></linearGradient>
 <radialGradient id="eye"><stop stop-color="#71627d"/><stop offset=".55" stop-color="#26202d"/><stop offset="1" stop-color="#0f1119"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#665a53" flood-opacity=".18"/></filter>
</defs>
