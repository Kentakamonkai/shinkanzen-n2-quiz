 <path d="M256 278 Q250 296 232 297 Q221 297 220 308 Q222 334 256 340 Q290 334 292 308 Q291 297 280 297 Q262 296 256 278Z" fill="#4c2838"/>
 <path d="M232 309 Q256 326 280 309 Q277 336 256 337 Q235 335 232 309Z" fill="#f1849b"/>
