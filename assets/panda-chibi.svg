 <ellipse cx="184" cy="222" rx="25" ry="36" fill="url(#eye)"/><ellipse cx="328" cy="222" rx="25" ry="36" fill="url(#eye)"/>
 <ellipse cx="176" cy="208" rx="11" ry="14" fill="#fff"/><ellipse cx="320" cy="208" rx="11" ry="14" fill="#fff"/>
 <circle cx="197" cy="236" r="5" fill="#fff" opacity=".85"/><circle cx="341" cy="236" r="5" fill="#fff" opacity=".85"/>
